name: Horilla CI/CD

on:
  push:
    branches: [ "1.0" ]
  pull_request:
    branches: [ "1.0" ]

env:
  AWS_REGION: us-east-1
  DOCKERHUB_REPOSITORY_FRONTEND: horilla-frontend
  DOCKERHUB_REPOSITORY_BACKEND: horilla-backend
  EKS_CLUSTER_NAME: sap-dev-eks-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build, tag, and push Backend image to Docker Hub
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY_BACKEND:$IMAGE_TAG -f Dockerfile-backend .
        docker push $DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY_BACKEND:$IMAGE_TAG

    - name: Build, tag, and push Frontend image to Docker Hub
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY_FRONTEND:$IMAGE_TAG -f Dockerfile-frontend .
        docker push $DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY_FRONTEND:$IMAGE_TAG

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Deploy to EKS
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        sed -i "s|image: .*backend:.*|image: $DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY_BACKEND:$IMAGE_TAG|g" k8s/deployment.yaml
        sed -i "s|image: .*frontend:.*|image: $DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY_FRONTEND:$IMAGE_TAG|g" k8s/deployment.yaml
        kubectl apply -f k8s/namespaces.yaml
        sleep 5
        kubectl apply -f k8s/
